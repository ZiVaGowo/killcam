# Общие параметры: читаются сервисом, eval-гейтом и DVC-пайплайном.
game:
  name: arena_clash
  ui_patch: "7.35"          # эталон UI текущей патч-версии (data/reference, DVC)

fixtures:
  seed: 42
  vod_frames: 100
  image_size: [320, 180]

drift:
  window: 50                # сколько последних скринов сравниваем с эталоном
  threshold: 0.15           # drift_score выше -> алерт "UI патчнулся" (норма ~0.02-0.05, после патча ~0.4)

eval:
  delta: 0.02               # гейт: не хуже прод-базлайна больше чем на δ
  hard:                     # жёсткие требования, δ не применяется
    redteam_block_rate: 1.0
    toxic_leak_count: 0
    schema_valid_rate: 1.0

cost:                       # $ за единицу (оценочные, для мониторинга)
  vlm_per_image: 0.0025
  stt_per_second: 0.0001
  llm_in_per_1k_tokens: 0.0005
  llm_out_per_1k_tokens: 0.0015
  tts_per_char: 0.000015
  image_gen_per_image: 0.02

serving:
  tts_seconds: 8
  sample_rate: 16000

highlights:                 # движок хайлайтов (app/highlights.py)
  chain_window_s: 10        # убийства одного игрока с паузой ≤ N с — одна серия (дабл/трипл)
  ace_window_s: 15          # все трое соперников убиты за N с — эйс
  one_man_window_s: 8       # один игрок забрал всех троих за N с — «в одиночку с одного прокаста»
  spree_kills: 3            # столько убийств без смерти — серия
  fast_tower_s: 150         # первая башня матча раньше N с — «рекордно быстро»
  lane_rush_s: 120          # линия снесена целиком за N с от первой башни — «снос линии»
  announce_threshold: 60    # озвучиваем только моменты с hype ≥ N
  records:                  # рекорды турнира (бьём — бонус и «новый рекорд!»)
    first_tower_s: 130
    lane_rush_s: 90
  hype:
    first_blood: 45
    double_kill: 50
    triple_kill: 75
    killing_spree: 60
    shutdown: 65
    ace: 85
    one_man_wipe: 100
    fast_tower: 70
    lane_rush: 80
    record_bonus: 10
