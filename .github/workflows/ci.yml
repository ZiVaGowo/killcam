name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · schema · unit · eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Data lock (golden set / UI reference не менялись молча)
        run: python scripts/data_lock.py --check
      - name: VOD frames (DVC stage `vod`)
        run: python scripts/make_fixtures.py --only vod
      - name: Unit + schema + red-team + multimodal tests
        run: pytest -q
      - name: Eval gate vs production baseline (δ из params.yaml)
        run: python -m evals.run_eval --out evals/reports/pr.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/

  smoke:
    name: smoke /health + stream (uvicorn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          uvicorn app.main:app --port 8000 &
          python scripts/smoke.py --url http://localhost:8000 --wait 30

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t killcam:ci .
      - run: docker run -d --name killcam -p 8000:8000 killcam:ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.28.1 && python scripts/smoke.py --url http://localhost:8000 --wait 60
      - if: failure()
        run: docker logs killcam
